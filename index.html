<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Swipe, tap, or use a keyboard or gamepad to slice fruit. Avoid bombs. Chase a high score."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blade Arc" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Blade Arc" />
    <meta
      property="og:description"
      content="Arcade fruit slicer. Play on phone, tablet, desktop, or TV."
    />
    <meta property="og:image" content="icon-512.png" />
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.json" />
    <title>Blade Arc</title>
    <style>
      @font-face {
        font-family: BA;
        src: url(fonts/OpenSans-Bold.ttf) format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --ui: BA, Arial, Helvetica, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100svh;
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        overscroll-behavior-x: none;
        background: #0f172a;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: var(--ui);
        color: #fff;
        font-weight: 800;
        position: fixed;
        inset: 0;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        display: block;
        cursor: crosshair;
        touch-action: none;
        -ms-touch-action: none;
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: calc(12px + env(safe-area-inset-top, 0px))
          calc(72px + env(safe-area-inset-right, 0px)) 0
          calc(16px + env(safe-area-inset-left, 0px));
        pointer-events: none;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #hud.show {
        opacity: 1;
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .lbl {
        font-family: var(--ui);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        font-weight: 700;
      }
      .val {
        font-size: clamp(28px, 7vw, 44px);
        line-height: 1;
        text-shadow:
          0 2px 0 #7f1d1d,
          0 0 18px rgba(220, 38, 38, 0.45);
        color: #fff;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .bestline {
        font-family: var(--ui);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
        font-weight: 700;
        margin-top: 2px;
      }
      .bestline b {
        color: #93c5fd;
        font-weight: 800;
      }
      #comboBox {
        position: absolute;
        left: 50%;
        top: calc(12px + env(safe-area-inset-top, 0px));
        text-align: center;
        min-width: 90px;
        opacity: 0;
        transform: translateX(-50%) scale(0.86);
        transition:
          opacity 0.15s,
          transform 0.15s;
        pointer-events: none;
      }
      #comboBox.on {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
      #comboBox .val {
        color: #22c55e;
        text-shadow:
          0 2px 0 #14532d,
          0 0 16px rgba(34, 197, 94, 0.5);
        font-size: clamp(22px, 5.5vw, 36px);
      }
      @media (max-width: 420px) {
        #hud {
          padding-right: calc(64px + env(safe-area-inset-right, 0px));
        }
        #comboBox {
          left: calc(16px + env(safe-area-inset-left, 0px));
          right: auto;
          top: calc(102px + env(safe-area-inset-top, 0px));
          transform: none;
          text-align: left;
          min-width: 0;
        }
        #comboBox.on {
          transform: none;
        }
      }
      .lives {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      .life {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #dc2626;
        box-shadow: 0 0 8px #dc2626;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .life.off {
        opacity: 0.22;
        transform: scale(0.75);
        background: #64748b;
        box-shadow: none;
      }
      #pauseBtn {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top, 0px));
        right: calc(12px + env(safe-area-inset-right, 0px));
        width: 48px;
        height: 48px;
        border: 2px solid rgba(255, 255, 255, 0.28);
        background: rgba(15, 23, 42, 0.55);
        border-radius: 12px;
        cursor: pointer;
        z-index: 3;
        display: none;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #fff;
        touch-action: manipulation;
      }
      #pauseBtn.show {
        display: flex;
      }
      #pauseBtn:hover,
      #pauseBtn:focus-visible {
        border-color: #fff;
        outline: 2px solid #dc2626;
        outline-offset: 2px;
      }
      #pauseBtn:active {
        transform: scale(0.95);
      }
      #overlay {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        background: rgba(8, 12, 24, 0.62);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: calc(12px + env(safe-area-inset-top, 0px))
          calc(12px + env(safe-area-inset-right, 0px))
          calc(12px + env(safe-area-inset-bottom, 0px))
          calc(12px + env(safe-area-inset-left, 0px));
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
        overscroll-behavior: contain;
      }
      #overlay.hide {
        display: none;
      }
      .card {
        width: min(420px, 92vw);
        margin: auto;
        max-height: none;
        overflow: visible;
        text-align: center;
        padding: 28px 22px 24px;
        border-radius: 20px;
        background: linear-gradient(
          180deg,
          rgba(30, 41, 59, 0.92),
          rgba(15, 23, 42, 0.96)
        );
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        touch-action: manipulation;
      }
      h1 {
        font-family: var(--ui);
        font-size: clamp(36px, 11vw, 64px);
        font-weight: 800;
        letter-spacing: 0.06em;
        line-height: 0.95;
        margin: 0 0 6px;
        text-transform: uppercase;
        color: #fff;
        filter: drop-shadow(0 3px 0 #7f1d1d);
      }
      @supports ((-webkit-background-clip: text) or (background-clip: text)) {
        h1 {
          background: linear-gradient(180deg, #fff 20%, #fda4af);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
      }
      .sub {
        font-family: var(--ui);
        font-size: 13px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #94a3b8;
        margin-bottom: 22px;
        font-weight: 700;
      }
      .msg {
        font-family: var(--ui);
        font-size: 15px;
        color: #cbd5e1;
        margin: 0 0 8px;
        line-height: 1.5;
        font-weight: 500;
      }
      .big {
        font-size: clamp(36px, 10vw, 52px);
        color: #22c55e;
        text-shadow: 0 2px 0 #14532d;
        margin: 4px 0 12px;
        font-weight: 800;
      }
      .row {
        font-family: var(--ui);
        font-size: 14px;
        color: #94a3b8;
        margin-bottom: 18px;
        font-weight: 600;
      }
      .btns {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button.m {
        min-height: 48px;
        min-width: 48px;
        border: 0;
        border-radius: 12px;
        font-family: var(--ui);
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        color: #fff;
        background: #dc2626;
        box-shadow: 0 4px 0 #7f1d1d;
        transition:
          transform 0.15s,
          filter 0.15s;
        touch-action: manipulation;
      }
      button.m:hover,
      button.m:focus-visible {
        filter: brightness(1.08);
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      button.m:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #7f1d1d;
      }
      button.m.sec {
        background: #2563eb;
        box-shadow: 0 4px 0 #1e3a8a;
      }
      button.m.ghost {
        background: transparent;
        box-shadow: none;
        border: 2px solid rgba(255, 255, 255, 0.22);
        font-size: 15px;
        color: #e2e8f0;
      }
      #hint {
        position: fixed;
        bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        left: 0;
        right: 0;
        text-align: center;
        font-family: var(--ui);
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        pointer-events: none;
        z-index: 2;
        opacity: 0;
        transition: opacity 0.3s;
        font-weight: 700;
      }
      #hint.show {
        opacity: 1;
      }
      .edge {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 16px;
        z-index: 3;
        display: none;
        touch-action: none;
        pointer-events: auto;
      }
      .edge.show {
        display: block;
      }
      #edgeL {
        left: 0;
      }
      #edgeR {
        right: 0;
      }
      @media (max-height: 500px) {
        .card {
          padding: 14px 16px 12px;
          margin: auto;
        }
        h1 {
          font-size: clamp(22px, 9vh, 40px);
        }
        .sub {
          margin-bottom: 10px;
          font-size: 11px;
        }
        .msg {
          margin-bottom: 4px;
          font-size: 13px;
        }
        .row {
          margin-bottom: 10px;
        }
        .btns {
          gap: 8px;
        }
        button.m {
          min-height: 48px;
          font-size: 15px;
        }
        #comboBox {
          top: calc(8px + env(safe-area-inset-top, 0px));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #hud,
        #comboBox,
        #hint {
          transition: none;
        }
        button.m {
          transition: none;
        }
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      #sliceBtn {
        position: fixed;
        left: calc(8px + env(safe-area-inset-left, 0px));
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        z-index: 3;
        min-height: 48px;
        min-width: 48px;
        padding: 0 14px;
        border: 2px solid rgba(255, 255, 255, 0.28);
        background: rgba(15, 23, 42, 0.55);
        border-radius: 12px;
        color: #fff;
        font-family: var(--ui);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        opacity: 0;
        touch-action: manipulation;
      }
      #sliceBtn.show {
        display: flex;
      }
      #sliceBtn:focus-visible {
        opacity: 1;
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <canvas id="c" aria-label="Blade Arc game canvas"></canvas>
    <div id="hud">
      <div class="stat">
        <span class="lbl">Score</span><span class="val" id="scoreEl">0</span>
        <div class="bestline">Best <b id="bestEl">0</b></div>
        <div class="lives" id="livesEl" aria-label="Lives"></div>
      </div>
      <div id="comboBox">
        <span class="lbl">Combo</span><span class="val" id="comboEl">x1</span>
      </div>
    </div>
    <div id="edgeL" class="edge" aria-hidden="true"></div>
    <div id="edgeR" class="edge" aria-hidden="true"></div>
    <button id="pauseBtn" aria-label="Pause game" title="Pause">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <rect x="3" y="2" width="4" height="14" rx="1" fill="currentColor" />
        <rect x="11" y="2" width="4" height="14" rx="1" fill="currentColor" />
      </svg>
    </button>
    <button id="sliceBtn" aria-label="Slice nearest fruit">Slice</button>
    <div id="sr" class="sr" aria-live="assertive" aria-atomic="true"></div>
    <div id="hint">Swipe to slice</div>
    <div id="overlay">
      <div class="card" id="panel"></div>
    </div>
    <noscript
      ><div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0f172a;
          color: #fff;
          font-family: system-ui, sans-serif;
          padding: 24px;
          text-align: center;
          z-index: 9;
        "
      >
        JavaScript is required to play Blade Arc.
      </div></noscript
    >
    <script>
      (() => {
        const canvas = document.getElementById("c");
        function getCtx() {
          const tries = [
            { alpha: false, desynchronized: true },
            { alpha: false },
            null,
          ];
          for (let i = 0; i < tries.length; i++) {
            try {
              const c = tries[i]
                ? canvas.getContext("2d", tries[i])
                : canvas.getContext("2d");
              if (c) return c;
            } catch (e) {}
          }
          return null;
        }
        const ctx = getCtx();
        if (!ctx) {
          const o = document.getElementById("overlay");
          const p = document.getElementById("panel");
          o.classList.remove("hide");
          p.innerHTML =
            '<h1 style="font-size:32px">UNABLE TO START</h1><p class="msg">This browser does not support Canvas 2D, which Blade Arc needs to draw the game.</p>';
          return;
        }
        const overlay = document.getElementById("overlay");
        const panel = document.getElementById("panel");
        const hud = document.getElementById("hud");
        const pauseBtn = document.getElementById("pauseBtn");
        const scoreEl = document.getElementById("scoreEl");
        const bestEl = document.getElementById("bestEl");
        const comboEl = document.getElementById("comboEl");
        const comboBox = document.getElementById("comboBox");
        const livesEl = document.getElementById("livesEl");
        const hintEl = document.getElementById("hint");
        const edgeL = document.getElementById("edgeL");
        const edgeR = document.getElementById("edgeR");
        const sliceBtn = document.getElementById("sliceBtn");
        const sr = document.getElementById("sr");

        const ST = { TITLE: 0, PLAY: 1, PAUSE: 2, OVER: 3 };
        const HS_KEY = "bladeArcHS";
        const SND_KEY = "bladeArcSnd";
        const reduce =
          (window.matchMedia &&
            matchMedia("(prefers-reduced-motion: reduce)").matches) ||
          false;
        const coarse =
          (window.matchMedia && matchMedia("(pointer: coarse)").matches) ||
          false;
        const mem = (() => {
          try {
            const k = "__ba";
            localStorage.setItem(k, "1");
            localStorage.removeItem(k);
            return localStorage;
          } catch (e) {
            const m = {};
            return {
              getItem: (k) =>
                Object.prototype.hasOwnProperty.call(m, k) ? m[k] : null,
              setItem: (k, v) => {
                m[k] = String(v);
              },
            };
          }
        })();

        let W = 0,
          H = 0,
          S = 1,
          dpr = 1,
          ox = 0,
          oy = 0;
        let state = ST.TITLE,
          score = 0,
          best = 0,
          lives = 3,
          combo = 0;
        let lastSlice = -9,
          spawnT = 0,
          elapsed = 0,
          bombChance = 0;
        let soundOn = true,
          audio,
          lastTs = 0,
          acc = 0,
          hintT = 0,
          flash = 0;
        const STEP = 1 / 60;
        let pausedFrom = ST.PLAY;
        let useTouch = 0;
        const hasPtr = typeof PointerEvent !== "undefined";

        const TYPES = [
          {
            n: "apple",
            r: 34,
            c: "#e11d2e",
            d: "#7f1d1d",
            j: "#ff4d5a",
            p: 10,
            leaf: 1,
          },
          {
            n: "orange",
            r: 32,
            c: "#f97316",
            d: "#c2410c",
            j: "#fb923c",
            p: 10,
          },
          {
            n: "melon",
            r: 44,
            c: "#16a34a",
            d: "#14532d",
            j: "#fb7185",
            p: 20,
            melon: 1,
          },
          {
            n: "lemon",
            r: 28,
            c: "#facc15",
            d: "#a16207",
            j: "#fde047",
            p: 15,
          },
          {
            n: "kiwi",
            r: 30,
            c: "#84cc16",
            d: "#3f6212",
            j: "#a3e635",
            p: 15,
            kiwi: 1,
          },
          {
            n: "peach",
            r: 31,
            c: "#fb7185",
            d: "#be123c",
            j: "#fda4af",
            p: 10,
          },
          {
            n: "berry",
            r: 22,
            c: "#7c3aed",
            d: "#4c1d95",
            j: "#c4b5fd",
            p: 25,
          },
        ];
        const BOMB = { n: "bomb", r: 30, bomb: 1, p: 0 };

        const fruits = [];
        const halves = [];
        const parts = [];
        const pops = [];
        const trails = [];
        const dust = [];
        const fFree = [],
          hFree = [],
          pFree = [],
          tFree = [],
          popFree = [];
        const ptrs = new Map();
        const held = Object.create(null);
        const aim = { on: 0, x: 0, y: 0, px: 0, py: 0, cut: 0 };
        let padPrev = 0,
          padNavT = 0;

        function mkFruit() {
          return {
            live: 0,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            rot: 0,
            vr: 0,
            r: 20,
            type: TYPES[0],
            bomb: 0,
            miss: 0,
          };
        }
        function mkHalf() {
          return {
            live: 0,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            rot: 0,
            vr: 0,
            r: 20,
            type: TYPES[0],
            ang: 0,
            side: 1,
            a: 1,
          };
        }
        function mkPart() {
          return {
            live: 0,
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            r: 3,
            life: 1,
            max: 1,
            c: "#fff",
            g: 0,
          };
        }
        function mkTrail() {
          return { live: 0, x: 0, y: 0, px: 0, py: 0, life: 1, w: 8 };
        }
        function mkPop() {
          return { live: 0, x: 0, y: 0, t: 0, txt: "", c: "#fff", s: 1 };
        }
        function take(free, mk, list) {
          const o = free.pop() || mk();
          o.live = 1;
          list.push(o);
          return o;
        }
        function sweep(list, free) {
          for (let i = list.length - 1; i >= 0; i--) {
            if (!list[i].live) {
              free.push(list[i]);
              list[i] = list[list.length - 1];
              list.pop();
            }
          }
        }

        function AudioBus() {
          this.ctx = null;
          this.noise = null;
        }
        AudioBus.prototype.ensure = function () {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            this.ctx = new AC();
            const n = this.ctx.createBuffer(
              1,
              this.ctx.sampleRate * 0.2,
              this.ctx.sampleRate,
            );
            const d = n.getChannelData(0);
            for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            this.noise = n;
          }
          if (this.ctx.state === "suspended") this.ctx.resume();
        };
        AudioBus.prototype.tone = function (f, dur, type, vol, slide) {
          if (!soundOn || !this.ctx) return;
          const t = this.ctx.currentTime;
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = type;
          o.frequency.setValueAtTime(f, t);
          if (slide)
            o.frequency.exponentialRampToValueAtTime(
              Math.max(40, slide),
              t + dur,
            );
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start(t);
          o.stop(t + dur + 0.02);
        };
        AudioBus.prototype.slice = function () {
          if (!soundOn || !this.ctx || !this.noise) return;
          const t = this.ctx.currentTime;
          const src = this.ctx.createBufferSource();
          src.buffer = this.noise;
          const bp = this.ctx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 2200;
          bp.Q.value = 0.8;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.22, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
          src.connect(bp);
          bp.connect(g);
          g.connect(this.ctx.destination);
          src.start(t);
          src.stop(t + 0.1);
          this.tone(880 + Math.random() * 400, 0.07, "triangle", 0.08, 420);
        };
        AudioBus.prototype.miss = function () {
          this.tone(180, 0.28, "sawtooth", 0.12, 70);
        };
        AudioBus.prototype.combo = function (n) {
          if (!soundOn || !this.ctx) return;
          const b = 520 + Math.min(n, 8) * 40;
          const t0 = this.ctx.currentTime;
          const notes = [b, b * 1.25, b * 1.5];
          const durs = [0.08, 0.1, 0.14];
          const vols = [0.1, 0.1, 0.12];
          for (let i = 0; i < 3; i++) {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = "square";
            o.frequency.setValueAtTime(notes[i], t0 + i * 0.05);
            g.gain.setValueAtTime(vols[i], t0 + i * 0.05);
            g.gain.exponentialRampToValueAtTime(
              0.0001,
              t0 + i * 0.05 + durs[i],
            );
            o.connect(g);
            g.connect(this.ctx.destination);
            o.start(t0 + i * 0.05);
            o.stop(t0 + i * 0.05 + durs[i] + 0.02);
          }
        };
        AudioBus.prototype.boom = function () {
          this.tone(90, 0.45, "sawtooth", 0.2, 40);
          this.tone(55, 0.5, "square", 0.12, 30);
        };
        AudioBus.prototype.ui = function () {
          this.tone(620, 0.06, "sine", 0.08);
        };
        audio = new AudioBus();

        function loadBest() {
          best = parseInt(mem.getItem(HS_KEY) || "0", 10) || 0;
          soundOn = mem.getItem(SND_KEY) !== "0";
          bestEl.textContent = String(best);
        }
        function saveBest() {
          if (score > best) {
            best = score;
            try {
              mem.setItem(HS_KEY, String(best));
            } catch (e) {}
            bestEl.textContent = String(best);
          }
        }
        function saveSnd() {
          try {
            mem.setItem(SND_KEY, soundOn ? "1" : "0");
          } catch (e) {}
        }

        function viewSize() {
          const vv = window.visualViewport;
          if (vv && vv.width && vv.height) {
            return {
              w: vv.width,
              h: vv.height,
              x: vv.offsetLeft || 0,
              y: vv.offsetTop || 0,
            };
          }
          return { w: window.innerWidth, h: window.innerHeight, x: 0, y: 0 };
        }
        function resize() {
          const v = viewSize();
          W = v.w;
          H = v.h;
          ox = v.x;
          oy = v.y;
          dpr = Math.min(3, window.devicePixelRatio || 1);
          const maxPx = 80e6;
          if (W * H * dpr * dpr > maxPx)
            dpr = Math.max(1, Math.sqrt(maxPx / Math.max(1, W * H)));
          canvas.width = Math.max(1, (W * dpr) | 0);
          canvas.height = Math.max(1, (H * dpr) | 0);
          canvas.style.width = W + "px";
          canvas.style.height = H + "px";
          canvas.style.top = oy + "px";
          canvas.style.left = ox + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          S = Math.max(0.55, Math.min(W, H) / 800);
        }

        function setLivesUI() {
          let h = "";
          for (let i = 0; i < 3; i++)
            h += '<span class="life' + (i < lives ? "" : " off") + '"></span>';
          livesEl.innerHTML = h;
        }
        function setScoreUI() {
          scoreEl.textContent = String(score);
          if (combo >= 2) {
            comboEl.textContent = "x" + combo;
            comboBox.classList.add("on");
          } else comboBox.classList.remove("on");
        }

        function overlayShow(html) {
          panel.innerHTML = html;
          overlay.classList.remove("hide");
          bindMenu();
        }
        function overlayHide() {
          overlay.classList.add("hide");
        }

        function titleHTML() {
          return (
            '<h1>BLADE ARC</h1><p class="sub">Arcade Fruit Slice</p><p class="msg">Slice fruit. Avoid bombs. Do not miss.</p><p class="row">Swipe, move to cut, or Slice</p><p class="row">Best ' +
            best +
            '</p><div class="btns"><button class="m" data-a="play">PLAY</button><button class="m ghost" data-a="snd">SOUND: ' +
            (soundOn ? "ON" : "OFF") +
            "</button></div>"
          );
        }
        function pauseHTML() {
          return (
            '<h1 style="font-size:42px">PAUSED</h1><p class="sub">Take a breath</p><div class="btns"><button class="m" data-a="resume">RESUME</button><button class="m sec" data-a="restart">RESTART</button><button class="m ghost" data-a="snd">SOUND: ' +
            (soundOn ? "ON" : "OFF") +
            '</button><button class="m ghost" data-a="title">TITLE</button></div>'
          );
        }
        function overHTML() {
          return (
            '<h1 style="font-size:42px">GAME OVER</h1><p class="sub">Final score</p><div class="big">' +
            score +
            '</div><p class="row">Best ' +
            best +
            '</p><div class="btns"><button class="m" data-a="restart">RESTART</button><button class="m ghost" data-a="title">TITLE</button></div>'
          );
        }

        function bindMenu() {
          const bs = panel.querySelectorAll("[data-a]");
          bs.forEach((b) => {
            b.addEventListener("click", () => {
              audio.ensure();
              audio.ui();
              act(b.getAttribute("data-a"));
            });
          });
          if (bs[0]) bs[0].focus();
        }

        function resetRun() {
          fruits.length = 0;
          halves.length = 0;
          parts.length = 0;
          pops.length = 0;
          trails.length = 0;
          score = 0;
          lives = 3;
          combo = 0;
          lastSlice = -9;
          spawnT = 0.35;
          elapsed = 0;
          bombChance = 0.04;
          flash = 0;
          hintT = 2.4;
          setLivesUI();
          setScoreUI();
        }

        function edges(on) {
          if (!edgeL || !edgeR) return;
          edgeL.classList.toggle("show", !!on);
          edgeR.classList.toggle("show", !!on);
        }
        function say(t) {
          if (!sr) return;
          sr.textContent = "";
          sr.textContent = t;
        }
        function goTitle() {
          state = ST.TITLE;
          resetRun();
          hud.classList.remove("show");
          pauseBtn.classList.remove("show");
          if (sliceBtn) sliceBtn.classList.remove("show");
          hintEl.classList.remove("show");
          edges(0);
          overlayShow(titleHTML());
          trapBack();
          say("Blade Arc. Best " + best + ". Play to start.");
        }
        function goPlay() {
          state = ST.PLAY;
          lastTs = 0;
          acc = 0;
          aim.on = 0;
          overlayHide();
          hud.classList.add("show");
          pauseBtn.classList.add("show");
          if (sliceBtn) sliceBtn.classList.add("show");
          hintEl.classList.toggle("show", hintT > 0);
          edges(1);
          setScoreUI();
          trapBack();
          say(
            "Playing. Score " +
              score +
              ". Lives " +
              lives +
              ". Swipe or press Slice.",
          );
        }
        function goPause() {
          if (state !== ST.PLAY) return;
          pausedFrom = state;
          state = ST.PAUSE;
          pauseBtn.classList.remove("show");
          if (sliceBtn) sliceBtn.classList.remove("show");
          edges(0);
          overlayShow(pauseHTML());
          trapBack();
          say("Paused. Score " + score + ".");
        }
        function goResume() {
          if (state !== ST.PAUSE) return;
          state = ST.PLAY;
          lastTs = 0;
          acc = 0;
          overlayHide();
          pauseBtn.classList.add("show");
          if (sliceBtn) sliceBtn.classList.add("show");
          edges(1);
          trapBack();
          say("Resumed. Score " + score + ". Lives " + lives + ".");
        }
        function goOver() {
          state = ST.OVER;
          saveBest();
          pauseBtn.classList.remove("show");
          if (sliceBtn) sliceBtn.classList.remove("show");
          hintEl.classList.remove("show");
          edges(0);
          overlayShow(overHTML());
          trapBack();
          say("Game over. Score " + score + ". Best " + best + ".");
        }

        function act(a) {
          if (a === "play") {
            resetRun();
            goPlay();
          } else if (a === "resume") goResume();
          else if (a === "restart") {
            resetRun();
            goPlay();
          } else if (a === "title") goTitle();
          else if (a === "snd") {
            soundOn = !soundOn;
            saveSnd();
            if (state === ST.TITLE) overlayShow(titleHTML());
            else if (state === ST.PAUSE) overlayShow(pauseHTML());
          }
        }

        function spawnFruit(demo) {
          const bomb = !demo && Math.random() < bombChance;
          const type = bomb ? BOMB : TYPES[(Math.random() * TYPES.length) | 0];
          const f = take(fFree, mkFruit, fruits);
          const r = type.r * S;
          const side = Math.random() < 0.18;
          f.type = type;
          f.bomb = bomb ? 1 : 0;
          f.r = r;
          f.rot = Math.random() * 6.28;
          f.vr = Math.random() * 4 - 2;
          f.miss = 0;
          const g = 1550 * S;
          const peak = Math.min(
            H * 0.55,
            Math.max(48 * S, H * (0.18 + Math.random() * 0.22)),
          );
          const lift = Math.max(80 * S, H - 24 * S - peak);
          const up = Math.sqrt(2 * g * lift);
          if (side) {
            const left = Math.random() < 0.5;
            f.x = left ? -r : W + r;
            f.y = H * (0.45 + Math.random() * 0.35);
            f.vx = (left ? 1 : -1) * (420 + Math.random() * 280) * S;
            f.vy = -up * (0.55 + Math.random() * 0.25);
          } else {
            f.x = r + Math.random() * Math.max(1, W - r * 2);
            f.y = H + r + 8;
            const mid = W * 0.5;
            f.vx =
              ((mid - f.x) * 0.35 + (Math.random() * 240 - 120)) * S * 0.55;
            f.vy = -up * (0.92 + Math.random() * 0.18);
          }
        }

        function burst(x, y, c, n, spd) {
          const k = reduce ? (n * 0.35) | 0 : n;
          for (let i = 0; i < k; i++) {
            const p = take(pFree, mkPart, parts);
            const a = Math.random() * 6.2832;
            const v = (0.3 + Math.random()) * spd * S;
            p.x = x;
            p.y = y;
            p.vx = Math.cos(a) * v;
            p.vy = Math.sin(a) * v - 80 * S;
            p.r = (2 + Math.random() * 5) * S;
            p.max = p.life = 0.35 + Math.random() * 0.45;
            p.c = c;
            p.g = 900 * S;
          }
        }

        function splitFruit(f, x0, y0, x1, y1) {
          let nx = -(y1 - y0),
            ny = x1 - x0;
          let len = Math.hypot(nx, ny) || 1;
          nx /= len;
          ny /= len;
          const kick = 280 * S;
          for (let s = -1; s <= 1; s += 2) {
            const h = take(hFree, mkHalf, halves);
            h.x = f.x;
            h.y = f.y;
            h.vx = f.vx + nx * kick * s;
            h.vy = f.vy + ny * kick * s - 80 * S;
            h.rot = f.rot;
            h.vr = f.vr + s * 6;
            h.r = f.r;
            h.type = f.type;
            h.ang = Math.atan2(ny, nx);
            h.side = s;
            h.a = 1;
          }
          burst(f.x, f.y, f.type.j || "#fff", 16, 420);
          const pop = take(popFree, mkPop, pops);
          pop.x = f.x;
          pop.y = f.y - f.r;
          pop.t = 0.7;
          pop.txt = "+" + f.type.p * Math.max(1, combo);
          pop.c = combo >= 3 ? "#22C55E" : "#fff";
          pop.s = combo >= 3 ? 1.25 : 1;
        }

        function hitSeg(ax, ay, bx, by, cx, cy, r) {
          const abx = bx - ax,
            aby = by - ay;
          const acx = cx - ax,
            acy = cy - ay;
          const ab2 = abx * abx + aby * aby;
          let t = ab2 > 0 ? (acx * abx + acy * aby) / ab2 : 0;
          if (t < 0) t = 0;
          else if (t > 1) t = 1;
          const dx = ax + abx * t - cx;
          const dy = ay + aby * t - cy;
          return dx * dx + dy * dy <= r * r;
        }

        function slicePath(x0, y0, x1, y1) {
          if (state !== ST.PLAY) return;
          const dx = x1 - x0,
            dy = y1 - y0;
          if (dx * dx + dy * dy < 1) return;
          let sliced = 0;
          for (let i = 0; i < fruits.length; i++) {
            const f = fruits[i];
            if (!f.live) continue;
            const rad = f.r * 1.22;
            if (hitSeg(x0, y0, x1, y1, f.x, f.y, rad)) {
              f.live = 0;
              if (f.bomb) {
                burst(f.x, f.y, "#f97316", 28, 520);
                burst(f.x, f.y, "#1e293b", 18, 380);
                flash = 0.35;
                audio.boom();
                lives = 0;
                setLivesUI();
                goOver();
                return;
              }
              const now = elapsed;
              if (now - lastSlice < 0.72) combo += 1;
              else combo = 1;
              lastSlice = now;
              score += f.type.p * combo;
              sliced++;
              splitFruit(f, x0, y0, x1, y1);
            }
          }
          if (sliced) {
            audio.slice();
            if (combo >= 3 && sliced) audio.combo(combo);
            setScoreUI();
            saveBest();
            flash = Math.min(0.12, flash + 0.04);
          }
        }

        function addTrail(x, y, px, py) {
          const t = take(tFree, mkTrail, trails);
          t.x = x;
          t.y = y;
          t.px = px;
          t.py = py;
          t.life = 0.18;
          t.w = 10 * S;
        }

        function ptrPos(e) {
          return { x: e.clientX - ox, y: e.clientY - oy };
        }
        function strokeTo(s, x, y) {
          const x0 = s.x,
            y0 = s.y;
          const dx = x - x0,
            dy = y - y0;
          const dist = Math.hypot(dx, dy);
          const step = Math.max(10, 14 * S);
          if (dist > step) {
            const n = Math.min(16, Math.ceil(dist / step));
            for (let i = 1; i <= n; i++) {
              const nx = x0 + dx * (i / n);
              const ny = y0 + dy * (i / n);
              addTrail(nx, ny, s.x, s.y);
              slicePath(s.x, s.y, nx, ny);
              s.px = s.x;
              s.py = s.y;
              s.x = nx;
              s.y = ny;
            }
          } else {
            s.px = x0;
            s.py = y0;
            s.x = x;
            s.y = y;
            addTrail(s.x, s.y, s.px, s.py);
            slicePath(s.px, s.py, s.x, s.y);
          }
        }

        function onDown(e) {
          if (e.pointerType === "mouse") useTouch = 0;
          if (useTouch || e.pointerType === "touch") return;
          if (e.button !== undefined && e.button !== 0) return;
          audio.ensure();
          const p = ptrPos(e);
          ptrs.set(e.pointerId, { x: p.x, y: p.y, px: p.x, py: p.y, down: 1 });
          try {
            canvas.setPointerCapture(e.pointerId);
          } catch (err) {}
        }
        function onMove(e) {
          if (useTouch || e.pointerType === "touch") return;
          const s = ptrs.get(e.pointerId);
          if (!s || !s.down) return;
          let list = null;
          try {
            if (typeof e.getCoalescedEvents === "function")
              list = e.getCoalescedEvents();
          } catch (err) {
            list = null;
          }
          if (list && list.length) {
            for (let i = 0; i < list.length; i++) {
              const p = ptrPos(list[i]);
              strokeTo(s, p.x, p.y);
            }
          } else {
            const p = ptrPos(e);
            strokeTo(s, p.x, p.y);
          }
        }
        function onUp(e) {
          ptrs.delete(e.pointerId);
        }

        function onTouchStart(e) {
          useTouch = 1;
          if (e.cancelable) e.preventDefault();
          audio.ensure();
          for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const x = t.clientX - ox,
              y = t.clientY - oy;
            ptrs.set(t.identifier, { x: x, y: y, px: x, py: y, down: 1 });
          }
        }
        function onTouchMove(e) {
          useTouch = 1;
          if (e.cancelable) e.preventDefault();
          for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            const s = ptrs.get(t.identifier);
            if (!s || !s.down) continue;
            strokeTo(s, t.clientX - ox, t.clientY - oy);
          }
        }
        function onTouchEnd(e) {
          if (e.cancelable) e.preventDefault();
          for (let i = 0; i < e.changedTouches.length; i++) {
            ptrs.delete(e.changedTouches[i].identifier);
          }
        }
        function onMouseDown(e) {
          if (useTouch || hasPtr) return;
          if (e.button !== 0) return;
          audio.ensure();
          const p = ptrPos(e);
          ptrs.set(-1, { x: p.x, y: p.y, px: p.x, py: p.y, down: 1 });
        }
        function onMouseMove(e) {
          if (useTouch || hasPtr) return;
          const s = ptrs.get(-1);
          if (!s || !s.down) return;
          const p = ptrPos(e);
          strokeTo(s, p.x, p.y);
        }
        function onMouseUp() {
          if (hasPtr) return;
          ptrs.delete(-1);
        }

        if (hasPtr) {
          canvas.addEventListener("pointerdown", onDown);
          canvas.addEventListener("pointermove", onMove);
          canvas.addEventListener("pointerup", onUp);
          canvas.addEventListener("pointercancel", onUp);
        } else {
          canvas.addEventListener("mousedown", onMouseDown);
          addEventListener("mousemove", onMouseMove);
          addEventListener("mouseup", onMouseUp);
        }
        canvas.addEventListener("touchstart", onTouchStart, { passive: false });
        canvas.addEventListener("touchmove", onTouchMove, { passive: false });
        canvas.addEventListener("touchend", onTouchEnd, { passive: false });
        canvas.addEventListener("touchcancel", onTouchEnd, { passive: false });
        canvas.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener(
          "touchmove",
          (e) => {
            if (state !== ST.PLAY) return;
            if (e.cancelable) e.preventDefault();
          },
          { passive: false },
        );
        document.addEventListener("gesturestart", (e) => e.preventDefault());

        pauseBtn.addEventListener("click", () => {
          audio.ensure();
          audio.ui();
          goPause();
        });
        if (sliceBtn) {
          sliceBtn.addEventListener("click", () => {
            if (aim.cut) return;
            slashNearest();
            aim.cut = 1;
          });
        }

        addEventListener("keydown", (e) => {
          held[e.key] = 1;
          const move =
            e.key === "ArrowUp" ||
            e.key === "ArrowDown" ||
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight" ||
            e.key === " ";
          if (move) e.preventDefault();
          if (e.repeat) return;
          if (e.key === "Escape" || e.key === "p" || e.key === "P") {
            e.preventDefault();
            if (state === ST.PLAY) goPause();
            else if (state === ST.PAUSE) goResume();
          } else if (
            (e.key === "Enter" || e.key === " ") &&
            (state === ST.TITLE || state === ST.OVER)
          ) {
            if (
              e.key === "Enter" &&
              e.target &&
              e.target.getAttribute &&
              e.target.getAttribute("data-a")
            )
              return;
            audio.ensure();
            audio.ui();
            act(state === ST.TITLE ? "play" : "restart");
          }
        });
        addEventListener("keyup", (e) => {
          held[e.key] = 0;
        });
        addEventListener("gamepadconnected", () => {
          audio.ensure();
          if (state === ST.PLAY) aimStart();
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden && state === ST.PLAY) goPause();
        });
        addEventListener("pagehide", () => {
          if (state === ST.PLAY) goPause();
        });
        addEventListener("blur", () => {
          for (const k in held) held[k] = 0;
          if (coarse) return;
          if (state === ST.PLAY) goPause();
        });
        let trapped = 0;
        try {
          history.scrollRestoration = "manual";
        } catch (e) {}
        function trapBack() {
          if (!coarse) return;
          try {
            if (!trapped) {
              history.pushState({ ba: 1 }, "", location.href);
              trapped = 1;
            }
            history.pushState({ ba: 2 }, "", location.href);
          } catch (e) {
            trapped = 0;
          }
        }
        addEventListener("popstate", () => {
          trapped = 0;
          if (!coarse) return;
          if (state === ST.PLAY) goPause();
          else if (state === ST.PAUSE) goResume();
          else if (state === ST.OVER) goTitle();
          trapBack();
        });
        function eatEdge(e) {
          if (state !== ST.PLAY) return;
          if (e.cancelable) e.preventDefault();
          e.stopPropagation();
        }
        if (edgeL && edgeR) {
          ["touchstart", "touchmove", "pointerdown", "pointermove"].forEach(
            (ev) => {
              edgeL.addEventListener(ev, eatEdge, { passive: false });
              edgeR.addEventListener(ev, eatEdge, { passive: false });
            },
          );
        }

        function aimStart() {
          if (aim.on) return;
          aim.on = 1;
          aim.x = aim.px = W * 0.5;
          aim.y = aim.py = H * 0.5;
          aim.cut = 0;
        }
        function nearestLive() {
          let bestF = null,
            bestD = 1e12;
          for (let i = 0; i < fruits.length; i++) {
            const f = fruits[i];
            if (!f.live) continue;
            const d =
              (f.x - W * 0.5) * (f.x - W * 0.5) +
              (f.y - H * 0.4) * (f.y - H * 0.4);
            if (d < bestD) {
              bestD = d;
              bestF = f;
            }
          }
          return bestF;
        }
        function slashNearest() {
          if (state !== ST.PLAY) return;
          audio.ensure();
          const f = nearestLive();
          if (!f) {
            say("No fruit in range.");
            return;
          }
          const x0 = f.x - f.r - 8,
            y0 = f.y;
          const x1 = f.x + f.r + 8,
            y1 = f.y;
          addTrail(x1, y1, x0, y0);
          slicePath(x0, y0, x1, y1);
          say(
            (f.bomb ? "Bomb. " : "Sliced. ") +
              "Score " +
              score +
              ". Lives " +
              lives +
              ".",
          );
        }
        function stepAim(dt) {
          let dx = 0,
            dy = 0;
          if (held.ArrowLeft || held.a || held.A) dx -= 1;
          if (held.ArrowRight || held.d || held.D) dx += 1;
          if (held.ArrowUp || held.w || held.W) dy -= 1;
          if (held.ArrowDown || held.s || held.S) dy += 1;
          let tap = !!(
            held[" "] ||
            held.Enter ||
            held.z ||
            held.Z ||
            held.x ||
            held.X
          );
          let pausePad = 0,
            navY = 0,
            confirm = 0;
          const pads = navigator.getGamepads ? navigator.getGamepads() : [];
          for (let i = 0; i < pads.length; i++) {
            const gp = pads[i];
            if (!gp) continue;
            const ax = gp.axes[0] || 0,
              ay = gp.axes[1] || 0;
            if (Math.abs(ax) > 0.22) dx += ax;
            if (Math.abs(ay) > 0.22) dy += ay;
            const b = gp.buttons;
            if (b[0] && b[0].pressed) {
              tap = 1;
              confirm = 1;
            }
            if (b[5] && b[5].pressed) tap = 1;
            if (b[7] && b[7].pressed) tap = 1;
            if ((b[9] && b[9].pressed) || (b[8] && b[8].pressed)) pausePad = 1;
            if (b[12] && b[12].pressed) navY -= 1;
            if (b[13] && b[13].pressed) navY += 1;
            if (b[14] && b[14].pressed) navY -= 1;
            if (b[15] && b[15].pressed) navY += 1;
          }
          if (dx || dy) {
            aimStart();
            const ox0 = aim.x,
              oy0 = aim.y;
            const sp = 640 * S * dt;
            const len = Math.hypot(dx, dy) || 1;
            aim.x = Math.max(8, Math.min(W - 8, aim.x + (dx / len) * sp));
            aim.y = Math.max(8, Math.min(H - 8, aim.y + (dy / len) * sp));
            if (state === ST.PLAY) {
              const s = { x: ox0, y: oy0, px: ox0, py: oy0 };
              strokeTo(s, aim.x, aim.y);
            }
          }
          if (state === ST.PLAY && tap && !aim.cut) {
            slashNearest();
            aim.cut = 1;
          }
          if (!tap) aim.cut = 0;
          if (pausePad && !padPrev) {
            if (state === ST.PLAY) goPause();
            else if (state === ST.PAUSE) goResume();
          }
          padPrev = pausePad;
          if (state !== ST.PLAY) {
            padNavT -= dt;
            const bs = panel.querySelectorAll("[data-a]");
            if (bs.length && padNavT <= 0) {
              if (confirm) {
                const f = document.activeElement;
                const a =
                  (f && f.getAttribute && f.getAttribute("data-a")) ||
                  (bs[0] && bs[0].getAttribute("data-a"));
                if (a) {
                  audio.ensure();
                  audio.ui();
                  act(a);
                }
                padNavT = 0.28;
              } else if (navY) {
                let i = Array.prototype.indexOf.call(
                  bs,
                  document.activeElement,
                );
                if (i < 0) i = 0;
                i = (i + (navY > 0 ? 1 : -1) + bs.length) % bs.length;
                bs[i].focus();
                padNavT = 0.18;
              }
            }
          }
        }
        function difficulty() {
          const t = Math.min(1, elapsed / 90);
          const sc = Math.min(1, score / 800);
          bombChance = 0.05 + sc * 0.12;
          return {
            interval: Math.max(0.38, 1.15 - t * 0.5 - sc * 0.28),
            extra: sc > 0.25 && Math.random() < 0.35 + sc * 0.3,
          };
        }

        function update(dt) {
          elapsed += dt;
          if (hintT > 0) {
            hintT -= dt;
            hintEl.classList.toggle("show", hintT > 0);
          }
          if (elapsed - lastSlice > 0.85 && combo) {
            combo = 0;
            setScoreUI();
          }
          flash = Math.max(0, flash - dt);
          spawnT -= dt;
          if (spawnT <= 0) {
            const d = difficulty();
            spawnFruit(0);
            if (d.extra) spawnFruit(0);
            if (score > 120 && Math.random() < 0.22) spawnFruit(0);
            spawnT = d.interval;
          }
          const g = 1550 * S;
          for (let i = 0; i < fruits.length; i++) {
            const f = fruits[i];
            if (!f.live) continue;
            f.vy += g * dt;
            f.x += f.vx * dt;
            f.y += f.vy * dt;
            f.rot += f.vr * dt;
            if (f.y > H + f.r + 40 && f.vy > 0) {
              f.live = 0;
              if (!f.bomb) {
                lives -= 1;
                audio.miss();
                setLivesUI();
                flash = 0.18;
                if (lives <= 0) goOver();
              }
            }
          }
          for (let i = 0; i < halves.length; i++) {
            const h = halves[i];
            if (!h.live) continue;
            h.vy += g * dt;
            h.x += h.vx * dt;
            h.y += h.vy * dt;
            h.rot += h.vr * dt;
            h.a -= dt * 0.55;
            if (h.a <= 0 || h.y > H + 80) h.live = 0;
          }
          for (let i = 0; i < parts.length; i++) {
            const p = parts[i];
            if (!p.live) continue;
            p.vy += p.g * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;
            if (p.life <= 0) p.live = 0;
          }
          for (let i = 0; i < pops.length; i++) {
            const p = pops[i];
            if (!p.live) continue;
            p.t -= dt;
            p.y -= 40 * dt;
            if (p.t <= 0) p.live = 0;
          }
          for (let i = 0; i < trails.length; i++) {
            const t = trails[i];
            if (!t.live) continue;
            t.life -= dt;
            if (t.life <= 0) t.live = 0;
          }
          sweep(fruits, fFree);
          sweep(halves, hFree);
          sweep(parts, pFree);
          sweep(pops, popFree);
          sweep(trails, tFree);
        }

        function updateTitle(dt) {
          spawnT -= dt;
          if (spawnT <= 0) {
            spawnFruit(1);
            spawnT = 0.9 + Math.random() * 0.6;
          }
          const g = 1550 * S;
          for (let i = 0; i < fruits.length; i++) {
            const f = fruits[i];
            if (!f.live) continue;
            f.vy += g * dt;
            f.x += f.vx * dt;
            f.y += f.vy * dt;
            f.rot += f.vr * dt;
            if (f.y > H + 80) f.live = 0;
          }
          for (let i = 0; i < dust.length; i++) {
            dust[i].y -= dust[i].sp * dt;
            dust[i].x += Math.sin(dust[i].p) * 8 * dt;
            dust[i].p += dt;
            if (dust[i].y < -4) {
              dust[i].y = H + 4;
              dust[i].x = Math.random() * W;
            }
          }
          sweep(fruits, fFree);
        }

        function initDust() {
          dust.length = 0;
          for (let i = 0; i < 28; i++) {
            dust.push({
              x: Math.random() * W,
              y: Math.random() * H,
              r: 0.8 + Math.random() * 1.6,
              a: 0.06 + Math.random() * 0.1,
              sp: 8 + Math.random() * 18,
              p: Math.random() * 6,
            });
          }
        }

        function oval(x, y, rx, ry, rot) {
          ctx.beginPath();
          if (ctx.ellipse) {
            ctx.ellipse(x, y, rx, ry, rot, 0, 6.2832);
          } else {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.scale(rx, ry);
            ctx.arc(0, 0, 1, 0, 6.2832);
            ctx.restore();
          }
          ctx.fill();
        }

        function drawFruitBody(x, y, r, rot, type, clipAng, side) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rot);
          if (clipAng != null) {
            ctx.beginPath();
            ctx.arc(
              0,
              0,
              r + 1,
              clipAng - (Math.PI / 2) * side,
              clipAng + (Math.PI / 2) * side,
            );
            ctx.closePath();
            ctx.clip();
          }
          if (type.bomb) {
            const g = ctx.createRadialGradient(
              -r * 0.3,
              -r * 0.3,
              r * 0.1,
              0,
              0,
              r,
            );
            g.addColorStop(0, "#475569");
            g.addColorStop(1, "#0f172a");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, 6.2832);
            ctx.fill();
            ctx.strokeStyle = "#020617";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.strokeStyle = "#94a3b8";
            ctx.lineWidth = 2 * S;
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.quadraticCurveTo(r * 0.6, -r * 1.35, r * 0.35, -r * 1.55);
            ctx.stroke();
            ctx.fillStyle = "#f97316";
            ctx.beginPath();
            ctx.arc(r * 0.35, -r * 1.55, 3.2 * S, 0, 6.2832);
            ctx.fill();
            ctx.fillStyle = "#fde68a";
            ctx.beginPath();
            ctx.arc(r * 0.35, -r * 1.55, 1.4 * S, 0, 6.2832);
            ctx.fill();
          } else {
            const g = ctx.createRadialGradient(
              -r * 0.35,
              -r * 0.38,
              r * 0.12,
              0,
              0,
              r,
            );
            g.addColorStop(0, "#fff6");
            g.addColorStop(0.18, type.c);
            g.addColorStop(1, type.d);
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, 6.2832);
            ctx.fill();
            if (type.melon) {
              ctx.strokeStyle = "rgba(20,83,45,.55)";
              ctx.lineWidth = r * 0.16;
              for (let k = -2; k <= 2; k++) {
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.82, k * 0.45 - 0.18, k * 0.45 + 0.18);
                ctx.stroke();
              }
            }
            if (type.kiwi) {
              ctx.fillStyle = "rgba(54,83,20,.35)";
              ctx.beginPath();
              ctx.arc(0, 0, r * 0.55, 0, 6.2832);
              ctx.fill();
            }
            ctx.fillStyle = "rgba(255,255,255,.32)";
            oval(-r * 0.28, -r * 0.32, r * 0.22, r * 0.13, -0.5);
            if (type.leaf && clipAng == null) {
              ctx.fillStyle = "#22c55e";
              oval(r * 0.15, -r * 0.92, r * 0.22, r * 0.12, 0.7);
              ctx.strokeStyle = "#7f1d1d";
              ctx.lineWidth = 2 * S;
              ctx.beginPath();
              ctx.moveTo(0, -r * 0.7);
              ctx.lineTo(0, -r * 1.05);
              ctx.stroke();
            }
          }
          if (clipAng != null) {
            ctx.restore();
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(
              0,
              0,
              r,
              clipAng - (Math.PI / 2) * side,
              clipAng + (Math.PI / 2) * side,
            );
            ctx.closePath();
            ctx.strokeStyle = type.j || "#fecaca";
            ctx.lineWidth = 3 * S;
            ctx.stroke();
            ctx.fillStyle = type.bomb ? "#1e293b" : type.j || "#fecaca";
            ctx.globalAlpha = 0.35;
            ctx.fill();
          }
          ctx.restore();
        }

        function drawBG() {
          const g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, "#1e1b4b");
          g.addColorStop(0.45, "#0f172a");
          g.addColorStop(0.78, "#1c1917");
          g.addColorStop(1, "#44403c");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          const vg = ctx.createRadialGradient(
            W * 0.5,
            H * 0.35,
            40,
            W * 0.5,
            H * 0.4,
            Math.max(W, H) * 0.72,
          );
          vg.addColorStop(0, "rgba(220,38,38,.08)");
          vg.addColorStop(1, "rgba(0,0,0,.45)");
          ctx.fillStyle = vg;
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "#292524";
          ctx.fillRect(0, H - 18 * S, W, 18 * S);
          ctx.fillStyle = "rgba(255,255,255,.04)";
          ctx.fillRect(0, H - 18 * S, W, 2);
          for (let i = 0; i < dust.length; i++) {
            const d = dust[i];
            ctx.fillStyle = "rgba(255,255,255," + d.a + ")";
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.r, 0, 6.2832);
            ctx.fill();
          }
        }

        function drawTrails() {
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          for (let i = 0; i < trails.length; i++) {
            const t = trails[i];
            if (!t.live) continue;
            const a = t.life / 0.18;
            ctx.strokeStyle = "rgba(255,255,255," + 0.55 * a + ")";
            ctx.lineWidth = t.w * a;
            ctx.beginPath();
            ctx.moveTo(t.px, t.py);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
            ctx.strokeStyle = "rgba(254,202,202," + 0.9 * a + ")";
            ctx.lineWidth = t.w * 0.4 * a;
            ctx.beginPath();
            ctx.moveTo(t.px, t.py);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
          }
        }

        function draw() {
          drawBG();
          for (let i = 0; i < halves.length; i++) {
            const h = halves[i];
            if (!h.live) continue;
            ctx.globalAlpha = Math.max(0, h.a);
            drawFruitBody(h.x, h.y, h.r, h.rot, h.type, h.ang, h.side);
            ctx.globalAlpha = 1;
          }
          for (let i = 0; i < fruits.length; i++) {
            const f = fruits[i];
            if (!f.live) continue;
            drawFruitBody(f.x, f.y, f.r, f.rot, f.type, null, 1);
          }
          for (let i = 0; i < parts.length; i++) {
            const p = parts[i];
            if (!p.live) continue;
            ctx.globalAlpha = Math.max(0, p.life / p.max);
            ctx.fillStyle = p.c;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * (p.life / p.max), 0, 6.2832);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          drawTrails();
          ctx.font = "700 " + 18 * S + "px BA,Arial,Helvetica,sans-serif";
          ctx.textAlign = "center";
          for (let i = 0; i < pops.length; i++) {
            const p = pops[i];
            if (!p.live) continue;
            ctx.globalAlpha = Math.min(1, p.t * 2);
            ctx.fillStyle = p.c;
            ctx.fillText(p.txt, p.x, p.y);
            ctx.globalAlpha = 1;
          }
          if (aim.on && (state === ST.PLAY || state === ST.PAUSE)) {
            ctx.strokeStyle = "rgba(255,255,255,.85)";
            ctx.lineWidth = 2 * S;
            ctx.beginPath();
            ctx.arc(aim.x, aim.y, 10 * S, 0, 6.2832);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(aim.x - 16 * S, aim.y);
            ctx.lineTo(aim.x + 16 * S, aim.y);
            ctx.moveTo(aim.x, aim.y - 16 * S);
            ctx.lineTo(aim.x, aim.y + 16 * S);
            ctx.stroke();
          }
          if (flash > 0) {
            ctx.fillStyle = "rgba(255,255,255," + flash * 0.35 + ")";
            if (lives <= 0)
              ctx.fillStyle = "rgba(220,38,38," + flash * 0.4 + ")";
            ctx.fillRect(0, 0, W, H);
          }
        }

        function step(dt) {
          stepAim(dt);
          if (state === ST.PLAY) update(dt);
          else if (state === ST.TITLE) updateTitle(dt);
          else {
            for (let i = 0; i < trails.length; i++) {
              trails[i].life -= dt;
              if (trails[i].life <= 0) trails[i].live = 0;
            }
            sweep(trails, tFree);
          }
        }
        function loop(ts) {
          const raw = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : STEP;
          lastTs = ts;
          acc += raw;
          if (acc > 0.25) acc = 0.25;
          while (acc >= STEP) {
            step(STEP);
            acc -= STEP;
          }
          draw();
          requestAnimationFrame(loop);
        }

        function onViewChange() {
          resize();
        }
        addEventListener("resize", onViewChange);
        addEventListener("orientationchange", () => {
          setTimeout(onViewChange, 80);
        });
        if (window.visualViewport) {
          visualViewport.addEventListener("resize", onViewChange);
          visualViewport.addEventListener("scroll", onViewChange);
        }
        loadBest();
        resize();
        initDust();
        goTitle();
        requestAnimationFrame(loop);
        if (/\btest=1\b/.test(location.search)) {
          window.__BA = {
            ST: ST,
            get: () => ({
              state: state,
              score: score,
              lives: lives,
              combo: combo,
              best: best,
              soundOn: soundOn,
              W: W,
              H: H,
              S: S,
              ox: ox,
              oy: oy,
              liveFruits: fruits.filter((f) => f.live).length,
              elapsed: elapsed,
            }),
            act: act,
            goPlay: goPlay,
            goPause: goPause,
            goResume: goResume,
            goOver: goOver,
            goTitle: goTitle,
            resetRun: resetRun,
            spawnFruit: spawnFruit,
            slicePath: slicePath,
            hitSeg: hitSeg,
            resize: resize,
            update: update,
            fruits: fruits,
          };
        }
      })();
    </script>
  </body>
</html>
